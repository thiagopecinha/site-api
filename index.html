<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horários Kennedy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --fundo: #EEF1F6; --papel: #FFFFFF; --tinta: #1B2430; --suave: #6B7686; --linha: #DDE2EA;
            --tec: #DCE8FF;  --tec-t: #1E4FBF;
            --lin: #EBDFFF;  --lin-t: #6035B8;
            --exa: #D5F2EA;  --exa-t: #0F7A5C;
            --hum: #FFEBC7;  --hum-t: #8A5200;
            --out: #FFDDE0;  --out-t: #B0303E;
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 32px 16px; background: var(--fundo); color: var(--tinta);
               font-family: 'Outfit', system-ui, sans-serif; }
        .pagina { max-width: 640px; margin: 0 auto; }

        h1 { margin: 0; font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; }
        header p { margin: 4px 0 20px; color: var(--suave); }

        .dias { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .dias button { font: inherit; font-weight: 500; padding: 10px 18px; border-radius: 999px; cursor: pointer;
                       border: 1px solid var(--linha); background: var(--papel); color: var(--tinta); }
        .dias button:hover { border-color: var(--tinta); }
        .dias button.ativo { background: var(--tinta); border-color: var(--tinta); color: #fff; }
        .dias button:focus-visible { outline: 3px solid #7FA6FF; outline-offset: 2px; }

        .cartao { background: var(--papel); border: 1px solid var(--linha); border-radius: 16px; padding: 20px; }
        h2 { margin: 0 0 12px; font-size: 1.2rem; font-weight: 600; }

        .linha { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 12px; padding: 6px 0; }
        .linha + .linha { border-top: 1px solid var(--linha); }
        .hora { color: var(--suave); font-weight: 500; font-variant-numeric: tabular-nums; }
        .aula { padding: 12px 14px; border-radius: 10px; font-weight: 500; line-height: 1.25; }
        .tec { background: var(--tec); color: var(--tec-t); }
        .lin { background: var(--lin); color: var(--lin-t); }
        .exa { background: var(--exa); color: var(--exa-t); }
        .hum { background: var(--hum); color: var(--hum-t); }
        .out { background: var(--out); color: var(--out-t); }

        .aviso { margin: 0; color: var(--suave); }
        .aviso.erro { color: var(--out-t); font-weight: 500; }

        .legenda { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 16px; font-size: .85rem; color: var(--suave); }
        .legenda span::before { content: ""; display: inline-block; width: 12px; height: 12px;
                                border-radius: 4px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
    </style>
</head>
<body>
    <div class="pagina">
        <header>
            <h1>Horários Kennedy</h1>
            <p>Escolha um dia para ver as aulas</p>
        </header>

        <main>
            <nav class="dias">
                <button data-dia="segunda" onclick="carregar_horario('segunda')">Segunda</button>
                <button data-dia="terça" onclick="carregar_horario('terça')">Terça</button>
                <button data-dia="quarta" onclick="carregar_horario('quarta')">Quarta</button>
                <button data-dia="quinta" onclick="carregar_horario('quinta')">Quinta</button>
                <button data-dia="sexta" onclick="carregar_horario('sexta')">Sexta</button>
            </nav>

            <section class="cartao">
                <h2 id="titulo"></h2>
                <div id="aulas"></div>
            </section>

            <div class="legenda">
                <span style="--c: var(--tec)">Tecnologia</span>
                <span style="--c: var(--lin)">Linguagens</span>
                <span style="--c: var(--exa)">Exatas</span>
                <span style="--c: var(--hum)">Humanas</span>
                <span style="--c: var(--out)">Outras</span>
            </div>
        </main>
    </div>

    <script>
        const nomes = {
            "segunda": "segunda-feira", "terça": "terça-feira", "quarta": "quarta-feira",
            "quinta": "quinta-feira", "sexta": "sexta-feira"
        }

        const normalizar = (t) =>
            String(t).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")

        // Define a cor de cada aula pela área da disciplina
        function categoria(nome) {
            const n = normalizar(nome)
            if (/educacao/.test(n)) return "out"
            if (/programacao|banco de dados|inovacao/.test(n)) return "tec"
            if (/lingua/.test(n)) return "lin"
            if (/matematica|fisica/.test(n)) return "exa"
            if (/filosofia|sociologia|historia/.test(n)) return "hum"
            return "out"
        }

        let ultimaBusca = 0

        async function carregar_horario(dia) {
            const busca = ++ultimaBusca
            const lista = document.getElementById("aulas")

            // Marca o botão do dia escolhido e troca o título
            document.querySelectorAll(".dias button").forEach((b) => {
                b.classList.toggle("ativo", b.dataset.dia === dia)
            })
            document.getElementById("titulo").textContent = "Aulas de " + nomes[dia]
            lista.innerHTML = '<p class="aviso">Carregando...</p>'

            try {
                // GET /horario/:dia
                const consulta = await fetch("http://localhost:3000/horario/" + encodeURIComponent(dia))
                if (!consulta.ok) throw new Error("Erro " + consulta.status)
                const aulas = await consulta.json()

                if (busca !== ultimaBusca) return // o usuário já clicou em outro dia

                if (aulas.length == 0) {
                    lista.innerHTML = '<p class="aviso">Nenhuma aula cadastrada!</p>'
                    return
                }

                let html = ""
                aulas.forEach((aula) => {
                    html += '<div class="linha"><span class="hora">' + aula.horario + "</span>" +
                            '<div class="aula ' + categoria(aula.componente) + '">' + aula.componente + "</div></div>"
                })
                lista.innerHTML = html
            } catch (erro) {
                if (busca !== ultimaBusca) return
                console.error(erro)
                lista.innerHTML = '<p class="aviso erro">Não foi possível carregar as aulas. Confira se a API está rodando (node server.js).</p>'
            }
        }

        // Começa mostrando o dia de hoje (ou segunda, no fim de semana)
        const hoje = new Date().getDay() // 1 = segunda ... 5 = sexta
        carregar_horario(["segunda", "terça", "quarta", "quinta", "sexta"][hoje >= 1 && hoje <= 5 ? hoje - 1 : 0])
    </script>
</body>
</html>
